name: enterprise-pathfinder
version: 0.1.0
manifest_version: 2
description: >-
  Map, contract inspector and evidence ledger that help Hermes work safely in enterprise
  software domains. First pack: SAP (OData V2/V4). Offline by default.
author: David Díaz Merino
license: MIT
homepage: https://github.com/DavidDiazMerino/hermes-pathfinder
tags: [sap, odata, enterprise, integration, skills]
requires_hermes: ">=0.23.0"
provides_tools:
  - pathfinder_sources
  - pathfinder_inspect
  - pathfinder_lab
provides_hooks:
  - pre_tool_call
  - post_tool_call
config_schema:
  gate_mode:
    type: str
    default: strict
    description: >-
      Evidence gate for skill_manage writes. strict = SAP-domain skills (declared or detected by
      content) need a verified Pathfinder run; declared = only skills that declare
      metadata.pathfinder; off = no gate.
